workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # CI_PIPELINE_SOURCE reference:
    # | Source              | Meaning |
    # | push                | A Git push created the pipeline. This includes branch pushes and tag pushes. |
    # | merge_request_event | GitLab created the pipeline for a merge request. |
    # | schedule            | A GitLab CI schedule created it. |
    # | api                 | Someone or something called the GitLab pipeline API, like our bot does. |
    # | web                 | A user clicked Run pipeline in the GitLab web UI. |
    # | trigger             | A pipeline trigger token created it. This is different from the normal API with a PAT. |
    # | pipeline            | A downstream multi-project pipeline created it. For example, project A triggers project B. |
    # | parent_pipeline     | A child pipeline created from a parent pipeline in the same project. Usually from trigger: include / child pipeline YAML. |
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "api"'
      when: always
    - when: never

default:
    interruptible: true

.default_job_template:
  rules:
    # CI_MERGE_REQUEST_DRAFT is not available in older GitLab versions (requires 17.10+), commented until GitLab is upgraded
    # - if: $CI_MERGE_REQUEST_DRAFT == "true"
    #   when: never
    # Workaround: Check MR title for draft prefixes (Draft:, WIP:, [WIP])
    - if: $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_REF_NAME =~ /^cudnn-gh\/.*$/'

.cudnn_dev_image:template:
    image: gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_13.3.0

.cudnn_rel_image:template:
    image: gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_13.3.0

.cudnn_ga_image:template:
    image: gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_9.24.0.43_13.3.0

.device_matrix:template:
    parallel:
        matrix:
            - ARCH: ["Hopper", "Ampere", "Blackwell"]
    tags:
        - ${ARCH}

.fetch_cudnn_dev:template:
    cache:
        - key: dev_cudnn_9_26_cuda_13_4
          paths:
              - downloads
    before_script:
        - mkdir -p downloads
        - ls -1 downloads/
        - python3 ci/fetch_cudnn.py --base-url https://artifactory.nvidia.com/artifactory/hw-cudnn-generic-local/BLOSSOM/v9.26 --cuda-version 13.4 --require-artifact-prop pipeline_type=merge_request
        - find /debug_cudnn
        - export CUDNN_PATH=/debug_cudnn # This is required for source building FE
        - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/debug_cudnn/lib64 # This is required for dlopening BE
        - export CUDNN_VERSION_=$(ls /debug_cudnn/lib/libcudnn.so.*.*.* | sed 's/.*libcudnn\.so\.//')

.fetch_cudnn_rel:template:
    cache:
        - key: rel_cudnn_9_25_cuda_13_4
          paths:
              - downloads
    before_script:
        - mkdir -p downloads
        - ls -1 downloads
        - python3 ci/fetch_cudnn.py --base-url https://artifactory.nvidia.com/artifactory/hw-cudnn-generic-local/BLOSSOM/v9.25 --cuda-version 13.4 --require-artifact-prop pipeline_type=merge_train
        - find /debug_cudnn
        - export CUDNN_PATH=/debug_cudnn # This is required for source building FE
        - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/debug_cudnn/lib64 # This is required for dlopening BE
        - export CUDNN_VERSION_=$(ls /debug_cudnn/lib/libcudnn.so.*.*.* | sed 's/.*libcudnn\.so\.//')

.build:template:
    stage: build
    script:
        - ci/build.sh
    tags:
        - Blackwell
    artifacts:
        paths:
            - build/

.cpp_samples:template:
    stage: cpp_samples
    script:
        - ci/run_cpp_samples.sh

.oss_tests:template:
    stage: oss_tests
    allow_failure: true
    script:
        - pip install -v .[cutedsl]
        - ci/run_test_oss.sh

.python_tests:template:
    stage: python_tests
    script:
        - ci/run_python_tests.sh

