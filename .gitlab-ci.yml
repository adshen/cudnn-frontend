# ==============================================================================
# Backend trigger jobs
# ==============================================================================

backend:rel:
    trigger:
        project:  cudnn/cudnn
        branch:   release/9.25.0
        strategy: depend
    inherit:
        variables: false
    variables:
        CI_CUDNN_FRONTEND_REF_NAME: $CI_COMMIT_REF_NAME
        CI_CUDNN_FRONTEND_COMMIT_SHA: $CI_COMMIT_SHA
        CI_CUDNN_FRONTEND_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE
    rules:
        - if: $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
          when: never
        - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "merge_request_event"
          variables:
              CI_CUDNN_FRONTEND_MERGE_REQUEST_SOURCE_BRANCH_NAME: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
        - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_REF_NAME =~ /^cudnn-gh\/.*$/'
          variables:
              CI_CUDNN_FRONTEND_MERGE_REQUEST_SOURCE_BRANCH_NAME: $CI_COMMIT_REF_NAME
    stage: backend_triggers
    needs: []
    interruptible: true

backend:dev:
    trigger:
        project:  cudnn/cudnn
        branch:   dev
        strategy: depend
    inherit:
        variables: false
    variables:
        CI_CUDNN_FRONTEND_REF_NAME: $CI_COMMIT_REF_NAME
        CI_CUDNN_FRONTEND_COMMIT_SHA: $CI_COMMIT_SHA
        CI_CUDNN_FRONTEND_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE
    rules:
        - if: $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
          when: never
        - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "merge_request_event"
          variables:
              CI_CUDNN_FRONTEND_MERGE_REQUEST_SOURCE_BRANCH_NAME: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
        - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_REF_NAME =~ /^cudnn-gh\/.*$/'
          variables:
              CI_CUDNN_FRONTEND_MERGE_REQUEST_SOURCE_BRANCH_NAME: $CI_COMMIT_REF_NAME
    stage: backend_triggers
    needs: []
    interruptible: true

# ==============================================================================
# Slack Notification
# ==============================================================================

slack_notification:
    stage: notify
    extends:
        - .cudnn_ga_image:template
    variables:
        GIT_STRATEGY: none
    before_script:
        - pip install requests --quiet
    script:
        - |
          curl -s -H "PRIVATE-TOKEN: $GITLAB_ALL_KEY" \
            "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/repository/files/ci%2Fscripts%2Fpipeline_slack_notifier.py/raw?ref=$CI_COMMIT_REF_NAME" \
            -o pipeline_slack_notifier.py

          curl -s -H "PRIVATE-TOKEN: $GITLAB_ALL_KEY" \
            "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/repository/files/ci%2Fscripts%2Fgitlab_pipeline_monitor.py/raw?ref=$CI_COMMIT_REF_NAME" \
            -o gitlab_pipeline_monitor.py

          python pipeline_slack_notifier.py \
            --bot-token "$CUDNN_FE_SLACK_BOT_TOKEN" \
            --token "$GITLAB_ALL_KEY" \
            --channel "#swdl-cudnn-frontend-dev" \
            --ref "$CI_COMMIT_REF_NAME"
    rules:
        - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_REF_NAME == "develop"'
          when: always
    when: always
    allow_failure: true
