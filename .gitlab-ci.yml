  - 'ci/analysis.yml'

  - local: ci/job-template.yml
    inputs:
        cuda_version: "13.1.0"
        cudnn_version: "9.19.0.56"
    rules:
        - if: $CI_PIPELINE_SOURCE == "schedule"

