.python_samples:template:
  stage: python_samples
  script:
    - pip install -v .
    - ci/stages/python_samples/run_python_samples.sh

py_samples:rel:
  parallel:
    matrix:
      - ARCH: ["Hopper", "Ampere", "Blackwell"]
  tags:
    - ${ARCH}
  extends:
    - .rules:mr_auto
    - .python_samples:template
    - .cudnn_rel_image:template
    - .fetch_cudnn_rel:template
  needs: ["manual:python_samples"]

py_samples:dev:
  parallel:
    matrix:
      - ARCH: ["Hopper", "Ampere", "Blackwell"]
  tags:
    - ${ARCH}
  extends:
    - .rules:mr_auto
    - .python_samples:template
    - .cudnn_dev_image:template
    - .fetch_cudnn_dev:template
  needs: ["manual:python_samples"]
