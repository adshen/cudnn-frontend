.clang_install:template:
    before_script:
        # key rotation required for older ngc images
        - apt update && apt install --allow-unauthenticated -y clang

.analysis_job_template:
    extends:
        - .rules:mr_auto
        - .cudnn_ga_image:template
    tags:
        - Blackwell

analysis:cudnn_clang_disable_exception:
    extends:
        - .analysis_job_template
    needs: []
    stage: analysis
    script:
        - !reference [.clang_install:template, before_script]
        - !reference [.fetch_cudnn_dev:template, before_script]
        - mkdir build && cd build
        - CC=/usr/bin/clang CXX=/usr/bin/clang++ cmake -DCMAKE_CXX_FLAGS="-DNV_CUDNN_DISABLE_EXCEPTION" ../
        - cmake --build . -j16 --verbose
        
analysis:cudnn_v9_no_half_conversion:
    needs: []
    stage: analysis
    script:
        - mkdir build && cd build
        - cmake -DCMAKE_CXX_FLAGS="-D__CUDA_NO_HALF_CONVERSIONS__" ../
        - cmake --build . -j16 --verbose
    extends:
        - .analysis_job_template
    
analysis:cudnn_clang:
    needs: []
    stage: analysis
    script:
        - !reference [.clang_install:template, before_script]
        - !reference [.fetch_cudnn_dev:template, before_script]
        - mkdir build && cd build
        - CC=/usr/bin/clang CXX=/usr/bin/clang++ cmake ../
        - cmake --build . -j16 --verbose
    extends:
        - .analysis_job_template

analysis:check-relative-includes:
    stage: analysis
    script:
        - echo "#include \"$CI_PROJECT_DIR/include/cudnn_frontend.h\"" > test_build.cpp
        - echo 'int main() { return 0; }' >> test_build.cpp
        - g++ -o test_build test_build.cpp -std=c++17 -I/usr/local/cuda/include/ -L/usr/lib/x86_64-linux-gnu/ -lcudnn
    extends:
        - .analysis_job_template
        - .cuda_12_1_cudnn_8_image:template

analysis:check-CUDNN_FRONTEND_SKIP_JSON_LIB:
    stage: analysis
    script:
        - ci/stages/analysis/build_wo_json.sh
    extends:
        - .analysis_job_template

analysis:clang-format:
    stage: analysis
    rules:
        - !reference [.rules:mr_auto_allow_failure, rules]
    script:
        - ci/stages/analysis/run_style_check_diff.sh
    extends:
        - .analysis_job_template

analysis:guardwords_scan:
    needs: []
    stage: analysis
    rules:
        - !reference [.rules:mr_auto_allow_failure, rules]
    variables:
        GUARDWORDS_REPO: "gitlab-master.nvidia.com/dlswqa/cudnn/flashinfer-guardwords-scan.git"
        GUARDWORDS_DIR: "/tmp/guardwords-scan"
    script:
        - git clone --depth 1
            "https://gitlab-ci-token:${CI_JOB_TOKEN}@${GUARDWORDS_REPO}"
            "${GUARDWORDS_DIR}"
        - python3 "${GUARDWORDS_DIR}/flashinfer_scan.py"
            --mode full
            --repo-root "${CI_PROJECT_DIR}"
    extends:
        - .analysis_job_template

analysis:jax-import-guard:
    needs: []
    stage: analysis
    script:
        - ci/stages/analysis/check_jax_import_guard.sh
    extends:
        - .analysis_job_template
        - .jax_26_07_image:template

analysis:github-file-sync:
    needs: []
    stage: analysis
    tags:
        - Blackwell
    rules:
        - !reference [.rules:nightly_develop, rules]
    script:
        - python3 ci/stages/analysis/check_github_file_sync.py
    extends:
        - .python_3_12_image:template
