.backend-trigger:
  inherit:
    variables: false
  variables:
    CI_CUDNN_FRONTEND_REF_NAME: $CI_COMMIT_REF_NAME
    CI_CUDNN_FRONTEND_COMMIT_SHA: $CI_COMMIT_SHA
    CI_CUDNN_FRONTEND_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE
    CI_CUDNN_FRONTEND_MERGE_REQUEST_SOURCE_BRANCH_NAME: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
  rules:
    # Same as .rules:mr_auto, but a bot pipeline has no merge request to read the
    # source branch from, so that one case is spelled out ahead of the shared set
    # to carry the variables override. First match wins.
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_REF_NAME =~ /^cudnn-gh\/.*$/'
      variables:
        CI_CUDNN_FRONTEND_MERGE_REQUEST_SOURCE_BRANCH_NAME: $CI_COMMIT_REF_NAME
    - !reference [.rules:mr_auto, rules]
  stage: backend_triggers
  interruptible: true

backend:rel:
  extends: .backend-trigger
  needs: ["manual:backend"]
  trigger:
    project: cudnn/cudnn
    branch: release/9.26.0
    strategy: depend

backend:dev:
  extends: .backend-trigger
  needs: ["manual:backend"]
  trigger:
    project: cudnn/cudnn
    branch: dev
    strategy: depend
