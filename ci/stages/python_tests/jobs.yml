.python_tests:template:
  stage: python_tests
  script:
    - ci/stages/python_tests/run_python_tests.sh

py_test:dev:
  extends:
    - .rules:mr_auto
    - .device_matrix:template
    - .cudnn_dev_image:template
    - .fetch_cudnn_dev:template
    - .python_tests:template
  needs: ["build:dev", "manual:python_tests"]

py_test:rel:
  extends:
    - .rules:mr_auto
    - .device_matrix:template
    - .cudnn_rel_image:template
    - .fetch_cudnn_rel:template
    - .python_tests:template
  needs: ["build:rel", "manual:python_tests"]
