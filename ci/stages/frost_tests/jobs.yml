# FROST engine tests, split one job per opset folder under test/python/<opset>/frost.
#
# Each opset only runs on the architectures its engines target, so a failure names
# both the opset and the GPU it failed on instead of being buried in one omnibus job:
#   sdpa             -> Blackwell, Ampere (the SM100 kernel tests self-skip off
#                       Blackwell; test_mhas_v2.py is the real non-Blackwell
#                       coverage -- it exercises FROST dispatch and the native
#                       cuDNN fallback through cudnn.pygraph)
#
# Hopper is deliberately absent: test_mhas_v2.py under -n 4 does not fit in the
# Hopper runner's memory, so the job failed on ~500 torch.OutOfMemoryError from
# the moment it was added (it was already red on !2254, the MR that introduced
# it) -- none of them a real defect, and FROST engines are SM100-only so they are
# not even eligible there. Restore the ARCH entry once the job fits, e.g. with a
# lower -n or PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True.
#   linear_attention -> Blackwell only (GDN / GDN2 / KDA kernels are SM100-only)
#   gemm             -> Blackwell only
.frost_tests:template:
  stage: frost_tests
  extends:
    - .rules:mr_auto
    - .cudnn_dev_image:template
    - .fetch_cudnn_dev:template
  needs: ["build:dev", "manual:frost"]
  script:
    - ci/stages/frost_tests/run_frost_tests.sh ${FROST_TEST_PATHS}

frost_tests:sdpa:
  extends: .frost_tests:template
  parallel:
    matrix:
      - ARCH: ["Blackwell", "Ampere"]
  tags:
    - ${ARCH}
  variables:
    FROST_TEST_PATHS: "test/python/sdpa/frost test/python/test_mhas_v2.py"

frost_tests:linear_attention:
  extends: .frost_tests:template
  tags: ["Blackwell"]
  variables:
    FROST_TEST_PATHS: "test/python/linear_attention/frost"

frost_tests:gemm:
  extends: .frost_tests:template
  tags: ["Blackwell"]
  variables:
    FROST_TEST_PATHS: "test/python/gemm/frost"

# ==============================================================================
# SM120 frost tests on cudnn-dev-net-22-04 / cudnn-dev-oar-22-04, each a
# single-GPU GeForce RTX 5080 box (compute capability 12.0). Registered as
# project runner ids 1360909 and 1360910, docker executor, concurrent = 1.
#
# These two boxes are dedicated to frost coverage and carry only the `SM120`
# tag. They are deliberately kept out of .device_matrix:template, so no other
# stage (python_tests, pycudnn, sanitizer, L4, oss, python_samples) fans out to
# them — frost is the only workload SM120 is expected to run.
#
# SM120 exercises the FROST SDPA kernel tests plus the pygraph routing and native
# fallback coverage in test_mhas_v2.py. Keeping this a separate job rather than
# another arch in the sdpa matrix also lets the softer rule set below apply only
# to SM120 without weakening the existing Blackwell gate.
# ==============================================================================
frost_tests:sm120:
  extends: .frost_tests:template
  tags: ["SM120"]
  rules:
    - !reference [.rules:mr_auto_allow_failure, rules]
  variables:
    FROST_TEST_PATHS: "test/python/sdpa/frost test/python/test_mhas_v2.py"
