.pycudnntest:template:
  stage: pycudnnTest
  script:
    - ci/stages/pycudnn_tests/run_pycudnntest.sh

pycudnn:dev:
  extends:
    - .rules:mr_auto
    - .device_matrix:template
    - .cudnn_dev_image:template
    - .fetch_cudnn_dev:template
    - .pycudnntest:template
  needs: ["build:dev", "manual:pycudnn"]

pycudnn:rel:
  extends:
    - .rules:mr_auto
    - .device_matrix:template
    - .cudnn_rel_image:template
    - .fetch_cudnn_rel:template
    - .pycudnntest:template
  needs: ["build:rel", "manual:pycudnn"]
