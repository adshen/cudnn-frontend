.build:template:
  stage: build
  script:
    - ci/stages/build/build.sh
  tags:
    - Blackwell
  artifacts:
    paths:
      - build/

build:dev:
  needs: []
  extends:
    - .rules:mr_auto
    - .cudnn_dev_image:template
    - .fetch_cudnn_dev:template
    - .build:template

build:rel:
  needs: []
  extends:
    - .rules:mr_auto
    - .cudnn_rel_image:template
    - .fetch_cudnn_rel:template
    - .build:template

build:win:
  tags:
    - Windows
  needs: []
  stage: build
  script:
    - $Env:CUDNN_PATH = "C:\Users\Public\Downloads\cudnn-9.18.1.3"
    - mkdir build
    - cd build
    - cmake ../
    - cmake --build . -j16 --verbose
  extends:
    - .rules:mr_auto
