spec:
  inputs:
    cudnn_version:
    cuda_version:
---    
"build:$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]":
  image: "gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]"
  stage: build
  # manual:qa_matrix is manual on a change pipeline and automatic on a schedule,
  # so this build and the jobs below stay nightly-only in practice until
  # somebody asks for them on an MR.
  needs: ["manual:qa_matrix"]
  variables:
    # The qa_matrix cpp_samples jobs below execute bin/samples and
    # bin/legacy_samples from this build's artifacts, so opt back into
    # building them (MR builds leave them off — see ci/stages/build/build.sh).
    FE_CI_BUILD_SAMPLES_AND_TESTS: "ON"
  extends:
    - .build:template

"cpp_samples:cudnn_$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]":
  image: "gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]"
  needs: ["build:$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]"]
  parallel:
    matrix:
      - ARCH: ["Hopper", "Ampere", "Blackwell"]
  tags:
    - ${ARCH}
  extends:
    - .cpp_samples:template

"python_tests:cudnn_$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]":
  image: "gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]"
  needs: ["build:$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]"]
  parallel:
    matrix:
      - ARCH: ["Hopper", "Ampere", "Blackwell"]
  tags:
    - ${ARCH}
  extends:
    - .python_tests:template
