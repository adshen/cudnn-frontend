.clang_install:template:
    before_script:
        # key rotation required for older ngc images
        - apt update && apt install --allow-unauthenticated -y clang

.analysis_job_template:
    extends:
        - .default_job_template
        - .cudnn_ga_image:template
    tags:
        - Blackwell

analysis:cudnn_clang_disable_exception:
    extends:
        - .analysis_job_template
    needs: []
    stage: analysis
    script:
        - !reference [.clang_install:template, before_script]
        - !reference [.fetch_cudnn_dev:template, before_script]
        - mkdir build && cd build
        - CC=/usr/bin/clang CXX=/usr/bin/clang++ cmake -DCMAKE_CXX_FLAGS="-DNV_CUDNN_DISABLE_EXCEPTION" ../
        - cmake --build . -j16 --verbose
        
analysis:cudnn_v9_no_half_conversion:
    needs: []
    stage: analysis
    script:
        - mkdir build && cd build
        - cmake -DCMAKE_CXX_FLAGS="-D__CUDA_NO_HALF_CONVERSIONS__" ../
        - cmake --build . -j16 --verbose
    extends:
        - .analysis_job_template
    
analysis:cudnn_clang:
    needs: []
    stage: analysis
    script:
        - !reference [.clang_install:template, before_script]
        - !reference [.fetch_cudnn_dev:template, before_script]
        - mkdir build && cd build
        - CC=/usr/bin/clang CXX=/usr/bin/clang++ cmake ../
        - cmake --build . -j16 --verbose
    extends:
        - .analysis_job_template

analysis:check-relative-includes:
    image: nvidia/cuda:12.1.1-cudnn8-devel-ubuntu22.04
    stage: analysis
    script:
        - echo "#include \"$CI_PROJECT_DIR/include/cudnn_frontend.h\"" > test_build.cpp
        - echo 'int main() { return 0; }' >> test_build.cpp
        - g++ -o test_build test_build.cpp -std=c++17 -I/usr/local/cuda/include/ -L/usr/lib/x86_64-linux-gnu/ -lcudnn
    extends:
        - .analysis_job_template

analysis:check-CUDNN_FRONTEND_SKIP_JSON_LIB:
    stage: analysis
    script:
        - ci/build_wo_json.sh
    extends:
        - .analysis_job_template

analysis:clang-format:
    stage: analysis
    allow_failure: true
    script:
        - ci/run_style_check_diff.sh
    extends:
        - .analysis_job_template

analysis:guardwords_scan:
    needs: []
    stage: analysis
    allow_failure: true
    variables:
        GUARDWORDS_REPO: "gitlab-master.nvidia.com/dlswqa/cudnn/flashinfer-guardwords-scan.git"
        GUARDWORDS_DIR: "/tmp/guardwords-scan"
    script:
        - git clone --depth 1
            "https://gitlab-ci-token:${CI_JOB_TOKEN}@${GUARDWORDS_REPO}"
            "${GUARDWORDS_DIR}"
        - python3 "${GUARDWORDS_DIR}/flashinfer_scan.py"
            --mode full
            --repo-root "${CI_PROJECT_DIR}"
    extends:
        - .analysis_job_template

analysis:github-file-sync:
    needs: []
    stage: analysis
    image: python:3.12
    tags:
        - Blackwell
    rules:
        - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop"'
    script:
        - python3 ci/check_github_file_sync.py
    extends:
        - .default_job_template

# ==============================================================================
# Sanitizer (ASan + UBSan) Jobs
# Build once, then run all test suites with sanitizer-instrumented binaries.
# ==============================================================================

.sanitizer_env:template:
    variables:
        ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:print_stacktrace=1:protect_shadow_gap=0"
        LSAN_OPTIONS: "suppressions=$CI_PROJECT_DIR/ci/sanitizer_suppressions.txt:print_suppressions=0"
        UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"

build:san:
    needs: []
    stage: analysis
    script:
        - ci/build_sanitizer.sh
    tags:
        - Blackwell
    artifacts:
        paths:
            - build/
    extends:
        - .default_job_template
        - .cudnn_dev_image:template
        - .fetch_cudnn_dev:template

# Python sanitizer tests are skipped: ASan must be the first library loaded
# in the process, but the Python interpreter isn't built with ASan. This is a
# known pybind11+ASan incompatibility (https://github.com/pybind/pybind11/issues/3655).
# The C++ tests provide sanitizer coverage for the same underlying code.

cpp_test:san:
    stage: sanitizer_tests
    extends:
        - .default_job_template
        - .device_matrix:template
        - .cudnn_dev_image:template
        - .fetch_cudnn_dev:template
        - .sanitizer_env:template
    script:
        - ci/run_cpp_tests.sh
    needs: ["build:san"]
